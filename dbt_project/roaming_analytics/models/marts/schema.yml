version: 2

models:
  - name: fct_roaming
    description: "Fact table with one row per national roaming usage event, ready for semantic layer consumption."
    columns:
      - name: roaming_event_id
        description: "Deterministic surrogate key identifying a unique roaming event."
        tests:
          - unique
          - not_null
      - name: event_date
        description: "Calendar date the roaming event occurred."
        tests:
          - not_null
      - name: country
        description: "Country where the roaming event occurred."
      - name: partner_network
        description: "Roaming partner network that served the event."
      - name: revenue
        description: "Revenue generated by the event, in USD."
      - name: duration
        description: "Call/session duration, in minutes."
      - name: total_mb
        description: "Data volume consumed, in megabytes."
