version: 2

sources:
  - name: raw
    description: "Raw operational tables loaded into the analytics warehouse."
    schema: public
    tables:
      - name: national_roaming
        description: "Raw national roaming usage events, loaded from sample_data/roaming_data.csv via the Postgres init script."
        columns:
          - name: event_date
            description: "Calendar date the roaming event occurred."
          - name: country
            description: "Country where the roaming event occurred."
          - name: partner_network
            description: "Roaming partner network that served the event."
          - name: revenue
            description: "Revenue generated by the event, in USD."
          - name: duration
            description: "Call/session duration, in minutes."
          - name: total_mb
            description: "Data volume consumed, in megabytes."
